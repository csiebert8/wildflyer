name: Build Mac app

# Builds "AUSL Schedule Solver.app" (Apple Silicon) on a GitHub macOS runner.
# Download it from the run's "Artifacts" section, or from a Release when a v* tag is pushed.
on:
  workflow_dispatch:  # "Run workflow" button on the Actions tab
  push:
    tags: ["v*"]      # e.g. v1.1 also publishes a Release with the zip

permissions:
  contents: write  # to attach the app to a Release on v* tags

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pillow

      - name: Build the app
        run: pyinstaller packaging/ausl_solver.spec --noconfirm

      - name: Smoke test (start the app, check it answers, stop it)
        env:
          AUSL_NO_BROWSER: "1"
          AUSL_DATA_DIR: ${{ runner.temp }}/ausl-data
        run: |
          "dist/AUSL Schedule Solver.app/Contents/MacOS/AUSL Schedule Solver" &
          APP_PID=$!
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8501/_stcore/health; then echo " (app is up)"; break; fi
            sleep 2
          done
          curl -sf http://localhost:8501/_stcore/health
          test -f "$AUSL_DATA_DIR/example_rules_2027.xlsx"
          kill $APP_PID

      - name: Zip
        run: ditto -c -k --keepParent "dist/AUSL Schedule Solver.app" AUSL-Schedule-Solver-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AUSL-Schedule-Solver-mac
          path: AUSL-Schedule-Solver-mac.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AUSL-Schedule-Solver-mac.zip
