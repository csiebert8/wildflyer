[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildflyer"
version = "0.1.0"
description = "Constraint-based sports league scheduler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "ortools>=9.10",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wildflyer = "wildflyer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wildflyer = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
